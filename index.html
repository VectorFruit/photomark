<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/sony-w.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoMark - 照片 EXIF 水印与相框</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body>
    <!-- App Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">📷</div>
        <span>PhotoMark</span>
      </div>

      <div class="header-actions">
        <button id="btn-import-photos" class="btn btn-secondary">
          <span>+ 添加照片</span>
        </button>
        <button id="btn-export-current" class="btn btn-primary">
          <span>导出当前照片</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
      <!-- Left Sidebar: Photo Queue -->
      <aside class="sidebar-left">
        <div class="section-header">
          <span>照片列表 (<span id="photo-count">0</span>)</span>
          <button id="btn-clear-all" class="photo-remove" title="清空列表">清空</button>
        </div>

        <div id="photo-list" class="photo-list">
          <!-- Populated by main.ts -->
        </div>

        <div id="empty-queue" class="empty-queue">
          <div style="font-size: 32px">📁</div>
          <div style="font-size: 13px; font-weight: 500">拖入照片或点击导入</div>
          <div style="font-size: 11px">支持 JPG, PNG, TIFF, WebP</div>
        </div>
      </aside>

      <!-- Center: Viewport / Canvas Stage -->
      <main class="stage">
        <div class="stage-toolbar">
          <button id="btn-zoom-out" class="tool-btn" title="缩小">-</button>
          <span id="zoom-level" style="font-size: 11px; font-weight: 600; min-width: 38px; text-align: center">100%</span>
          <button id="btn-zoom-in" class="tool-btn" title="放大">+</button>
          <button id="btn-zoom-fit" class="tool-btn" title="适应屏幕">适应</button>
        </div>

        <div class="viewport" id="viewport-area">
          <div class="canvas-container" id="canvas-container">
            <canvas id="preview-canvas"></canvas>
          </div>
        </div>
      </main>

      <!-- Right Sidebar: Inspector -->
      <aside class="sidebar-right">
        <!-- 1. Frame Template -->
        <div class="settings-group">
          <div class="group-title">相框模板</div>
          <div class="template-grid">
            <div class="template-card active" data-template="bottom_bar">经典底栏</div>
            <div class="template-card" data-template="border">画廊相框</div>
            <div class="template-card" data-template="frosted_blur">毛玻璃虚化</div>
            <div class="template-card" data-template="polaroid">拍立得即显</div>
            <div class="template-card" data-template="minimal_badge">极简微章</div>
          </div>
        </div>

        <!-- 2. Logo & Brand -->
        <div class="settings-group">
          <div class="group-title">相机与品牌 Logo</div>
          <div class="control-row">
            <span class="control-label">显示品牌 Logo</span>
            <input type="checkbox" id="cfg-show-logo" checked />
          </div>

          <div class="control-row">
            <span class="control-label">品牌图标</span>
            <select id="cfg-brand-logo" style="width: 140px">
              <option value="auto">自动识别 (EXIF)</option>
              <option value="sony">SONY 索尼</option>
              <option value="canon">Canon 佳能</option>
              <option value="nikon">Nikon 尼康</option>
              <option value="leica">Leica 徕卡</option>
              <option value="fujifilm">FUJIFILM 富士</option>
              <option value="hasselblad">Hasselblad 哈苏</option>
              <option value="panasonic">Panasonic 松下</option>
              <option value="olympus">Olympus 奥林巴斯</option>
              <option value="dji">DJI 大疆</option>
              <option value="ricoh">RICOH 理光</option>
              <option value="apple">Apple 苹果</option>
              <option value="zeiss">ZEISS 蔡司</option>
            </select>
          </div>
        </div>

        <!-- 3. Parameters Display -->
        <div class="settings-group">
          <div class="group-title">参数显示项</div>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="cfg-show-model" checked /> 相机型号</label>
            <label class="checkbox-item"><input type="checkbox" id="cfg-show-lens" checked /> 镜头型号</label>
            <label class="checkbox-item"><input type="checkbox" id="cfg-show-params" checked /> 曝光三要素</label>
            <label class="checkbox-item"><input type="checkbox" id="cfg-show-date" checked /> 拍摄日期</label>
          </div>

          <div class="control-row" style="margin-top: 6px">
            <span class="control-label">自定义签名 / 备注</span>
          </div>
          <input type="text" id="cfg-custom-note" placeholder="例如: Photo by Alex" />
        </div>

        <!-- 4. Style & Layout Tuning -->
        <div class="settings-group">
          <div class="group-title">样式与细节调节</div>
          
          <div class="control-row">
            <span class="control-label">色彩主题</span>
            <select id="cfg-theme">
              <option value="light">明亮浅色</option>
              <option value="dark">质感深黑</option>
            </select>
          </div>

          <div class="control-row">
            <span class="control-label">边距留白</span>
            <input type="range" id="cfg-padding" min="2" max="15" value="4" />
          </div>

          <div class="control-row">
            <span class="control-label">字体大小</span>
            <input type="range" id="cfg-font-scale" min="80" max="150" value="100" />
          </div>

          <div class="control-row">
            <span class="control-label">圆角弧度</span>
            <input type="range" id="cfg-border-radius" min="0" max="30" value="0" />
          </div>

          <div class="control-row">
            <span class="control-label">投影阴影</span>
            <input type="range" id="cfg-shadow" min="0" max="50" value="10" />
          </div>
        </div>

        <!-- 5. Export -->
        <div class="settings-group">
          <div class="group-title">导出配置</div>
          <div class="control-row">
            <span class="control-label">导出格式</span>
            <select id="export-format">
              <option value="jpeg">JPEG (高画质)</option>
              <option value="png">PNG (无损格式)</option>
              <option value="webp">WebP (现代高效)</option>
            </select>
          </div>

          <div class="control-row">
            <span class="control-label">画质</span>
            <input type="range" id="export-quality" min="70" max="100" value="95" />
          </div>

          <button id="btn-batch-export" class="btn btn-primary btn-block" style="margin-top: 10px">
            ⚡ 批量导出全部照片
          </button>
        </div>
      </aside>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
