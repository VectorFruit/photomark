[package]
name = "photomark"
version = "1.5.1"
description = "A modern, lightweight photo EXIF watermark and frame studio"
authors = ["vectorfruit"]
edition = "2021"

[lib]
name = "photomark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
font-kit = "0.14"
base64 = "0.22"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
glob = "0.3"
